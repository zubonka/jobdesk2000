# Конфігурація Netlify для JobDesk 2000

[build]
  # Публікуємо лише public/: звичайні ES-модулі, без кроку збірки
  publish = "public"
  # Serverless-функції; спільний код лежить у netlify/lib, щоб Netlify не зробив із нього окремі функції
  functions = "netlify/functions"

[functions]
  # esbuild вшиває netlify/lib у кожну функцію
  node_bundler = "esbuild"

# Захисні заголовки для всіх сторінок і файлів.
# Cross-Origin-Opener-Policy свідомо не ставимо: він ламає вхід через Google (Firebase signInWithPopup).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Картинки та звуки змінюються рідко: тиждень у кеші браузера
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Код має оновитися одразу після деплою: браузер щоразу перевіряє версію (ETag робить це дешевим)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Стилі так само, як код
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

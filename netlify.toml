# Конфігурація Netlify для JobDesk 2000

[build]
  # Публікуємо лише public/: звичайні ES-модулі, без кроку збірки
  publish = "public"
  # Serverless-функції; спільний код лежить у netlify/lib, щоб Netlify не зробив із нього окремі функції
  functions = "netlify/functions"

[functions]
  # esbuild вшиває netlify/lib у кожну функцію
  node_bundler = "esbuild"

# Захисні заголовки для всіх сторінок і файлів.
# Cross-Origin-Opener-Policy свідомо не ставимо: він ламає вхід через Google (Firebase signInWithPopup).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Повна політика поки що лише звітує (у консоль браузера) і нічого не блокує. Коли на проді в консолі
    # не буде повідомлень "[Report Only]", її можна перенести в Content-Security-Policy вище.
    # Хеш — це вбудований скрипт теми в index.html: змінюєш той скрипт — онови й хеш.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'sha256-BdiysiBDQfo9M/c+xGnHATYotE7QnmFL4n0mIXiR18A=' https://www.gstatic.com https://cdnjs.cloudflare.com https://apis.google.com; worker-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://cdnjs.cloudflare.com https://apis.google.com; frame-src https://jobdesk2000.firebaseapp.com https://accounts.google.com https://apis.google.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self' data:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Картинки та звуки змінюються рідко: тиждень у кеші браузера
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Код має оновитися одразу після деплою: браузер щоразу перевіряє версію (ETag робить це дешевим)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker перевіряється при кожному відкритті, щоб нова версія застосунку приходила одразу
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Стилі так само, як код
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
